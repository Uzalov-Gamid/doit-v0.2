name: Django tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doit
          POSTGRES_USER: doit_user
          POSTGRES_PASSWORD: doit_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doit_user -d doit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: doit
      POSTGRES_USER: doit_user
      POSTGRES_PASSWORD: doit_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply migrations
        run: python app/manage.py migrate --noinput

      - name: Run Django system check
        run: python app/manage.py check

      - name: Run tests
        run: python app/manage.py test accounts tasks activity
