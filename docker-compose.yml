services:
  database:
    image: postgres:16-alpine
    container_name: doit_database
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-doit}"
      POSTGRES_USER: "${POSTGRES_USER:-doit_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-doit_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-doit_user} -d ${POSTGRES_DB:-doit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: doit_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-secret-key}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}"
      POSTGRES_DB: "${POSTGRES_DB:-doit}"
      POSTGRES_USER: "${POSTGRES_USER:-doit_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-doit_password}"
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
